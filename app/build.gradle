plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.gray.questbilifix'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.gray.questbilifix'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Stubs are compile-only; LSPosed provides the real Xposed API at runtime.
    compileOnly project(':xposed-api-stubs')
    testImplementation 'junit:junit:4.13.2'
}
